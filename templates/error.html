{% extends "base.html" %}
{% block title %}Invalid Input — EduPredict{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
  <div class="card p-8 text-center">
    <div class="inline-block bg-red-100 text-red-600 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wide mb-4">Invalid Input</div>
    <h2 class="text-2xl font-bold text-gray-800 mb-3">We couldn't process that submission</h2>
    <p class="text-gray-500 mb-6">{{ message }}</p>
    <a href="/" class="gradient-bg text-white px-6 py-3 rounded-xl font-medium hover:opacity-90 transition-all inline-block">
      &larr; Back to Form
    </a>
  </div>
</div>

{% endblock %}
